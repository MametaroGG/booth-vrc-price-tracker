name: Recover saved BoopaDB candidate (publication off)

on:
  workflow_dispatch:

concurrency:
  group: boopadb-readonly-recovery
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  recover_saved:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout immutable recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/boopa
            .github/workflows
      - name: Replay saved collection without collecting or publishing
        timeout-minutes: 75
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY_BOOT'
          import hashlib, importlib.util, json, os, pathlib, re, shutil, subprocess, sys
          root = pathlib.Path('.github/boopa').resolve(strict=True)
          manifest = root / 'DEPLOYMENT-CODE-INVENTORY.json'
          if manifest.is_symlink() or hashlib.sha256(manifest.read_bytes()).hexdigest() != 'bf3424a77e4843d0055b43489efc5de5244d71411ba2437b2f47878a100e6580':
              raise SystemExit('Deployment inventory differs; stop')
          for name, entry in json.loads(manifest.read_bytes())['files'].items():
              path = root / name
              if path.is_symlink() or not path.resolve().is_relative_to(root) or not path.is_file():
                  raise SystemExit('Invalid deployment member; stop')
              raw = path.read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit('Deployment code differs; stop')
          recovery_root = root / 'capacity-recovery-r2'
          recovery_manifest = recovery_root / 'CODE-INVENTORY.json'
          if recovery_manifest.is_symlink() or hashlib.sha256(recovery_manifest.read_bytes()).hexdigest() != 'eddff02a56eb875b8dcdfc71f734fb4a187c45731d442a4cd383244f0b84b2d8':
              raise SystemExit('Recovery code inventory differs; stop')
          for name, entry in json.loads(recovery_manifest.read_bytes())['files'].items():
              path = recovery_root / name
              if path.is_symlink() or not path.resolve().is_relative_to(recovery_root) or not path.is_file():
                  raise SystemExit('Invalid recovery code member; stop')
              raw = path.read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit('Recovery code differs; stop')
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          available = shutil.disk_usage(temp).free
          print(json.dumps({'capacity_free_bytes': available, 'capacity_required_free_bytes': 20 * 1024**3}), flush=True)
          if available < 20 * 1024**3:
              names = ('GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','GITHUB_REPOSITORY','ImageOS','ImageVersion','RUNNER_TEMP','GITHUB_WORKSPACE')
              subprocess.run(['sudo','env',*[name+'='+os.environ[name] for name in names],sys.executable,'-I',str(recovery_root/'capacity_preflight.py'),'--cleanup-preinstalled-sdks'],check=True,timeout=310)
              available = shutil.disk_usage(temp).free
              print('capacity_free_bytes_after_cleanup=' + str(available), flush=True)
          if available < 20 * 1024**3:
              raise SystemExit('Need 20 GiB free after allowlisted SDK cleanup; stop')
          maker = recovery_root / 'make_replay_plan.py'
          spec = importlib.util.spec_from_file_location('make_saved_replay_plan', maker)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names = ('GITHUB_SERVER_URL','GITHUB_ACTIONS','GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_WORKFLOW_REF','GITHUB_WORKFLOW_SHA')
          plan = module.make(pathlib.Path('.github/workflows/daily_scrape.yml').resolve(strict=True), temp / 'boopa-replay-plan', {name: os.environ.get(name) for name in names})
          entry = recovery_root / 'replay_entry/run_replay_entry.py'
          subprocess.run([sys.executable,'-I',str(entry),'--plan',plan['path'],'--plan-sha256',plan['sha256'],'--output',str(temp/'boopa-replayed')],check=True)
          print('Historical saved input and local candidate validated. Collection restart and publication remain OFF.')
          PY_BOOT
