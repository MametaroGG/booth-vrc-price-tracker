name: Bounded BOOTH validation 20261005

on:
  push:
    branches: ['test/bounded-booth-probe-20261005']
    paths: ['validation/runner/activation.json']

permissions:
  contents: read

concurrency:
  group: scrape-group
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'MametaroGG/booth-vrc-price-tracker' &&
      github.ref == 'refs/heads/test/bounded-booth-probe-20261005' &&
      github.event_name == 'push' &&
      github.event.before == '4aedd907f01f10ce5eb36f69401fff4dadf89383' &&
      !github.event.created && !github.event.deleted &&
      github.run_number == '1' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout isolated validation source
        uses: actions/checkout@v4
        timeout-minutes: 4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /test/
            /scripts/push-data.sh
            /.github/workflows/
            /validation/runner/
            /package.json
            /package-lock.json
            /.gitignore

      - name: Setup Node
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 2
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify offline checks and prepare isolated files
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm test
          mkdir "$RUNNER_TEMP/boopa-probe"
          cp -R validation/runner/. "$RUNNER_TEMP/boopa-probe/"
          cd "$RUNNER_TEMP/boopa-probe"
          BOOPA_REPO="$GITHUB_WORKSPACE" node --require ./offline-only.cjs --test probe.test.js gate.test.js
          cp prior-ledger.json working-ledger.json

      - name: Verify disabled production workflow and run the bounded probe
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/boopa-probe"
          node gate.js activation.json | tee preflight.json
          DAY=$(node -p "require('./activation.json').expectedJstDay")
          UNTIL=$(node -p "require('./activation.json').exclusiveUntil")
          BOOPA_REPO="$GITHUB_WORKSPACE" node probe.js --execute \
            --accounting-scope incremental-exception \
            --budget-file "$RUNNER_TEMP/boopa-probe/working-ledger.json" \
            --expected-jst-day "$DAY" --exclusive-until "$UNTIL" \
            --history-cache "$RUNNER_TEMP/boopa-probe/history-cache" 2>&1 | tee probe.log

      - name: Preserve terminal counter and result in job logs
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'boopa-probe');
          for (const file of ['working-ledger.json', 'preflight.json']) {
            const p = path.join(root, file);
            if (fs.existsSync(p)) console.log(file + '\n' + fs.readFileSync(p, 'utf8'));
          }
          const runs = path.join(root, 'runs');
          if (fs.existsSync(runs)) for (const name of fs.readdirSync(runs)) {
            for (const file of ['summary.json', 'requests.jsonl']) {
              const p = path.join(runs, name, file);
              if (fs.existsSync(p)) console.log(name + '/' + file + '\n' + fs.readFileSync(p, 'utf8'));
            }
          }
          NODE

      - name: Preserve read-only validation results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: bounded-booth-validation-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/boopa-probe/working-ledger.json
            ${{ runner.temp }}/boopa-probe/preflight.json
            ${{ runner.temp }}/boopa-probe/probe.log
            ${{ runner.temp }}/boopa-probe/runs/*/summary.json
            ${{ runner.temp }}/boopa-probe/runs/*/requests.jsonl
