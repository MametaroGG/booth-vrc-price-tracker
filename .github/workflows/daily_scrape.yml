name: Daily Scrape

on:
  schedule:
    - cron: '0 15,21,3,9 * * *' # JST 00:00, 06:00, 12:00, 18:00
  workflow_dispatch:
  repository_dispatch:
    types: [continue-scrape]

concurrency:
  group: scrape-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      # Empty unless the eligible same-job receipt artifact was uploaded.
      boopadb_saved_commit: ${{ steps.saved_collection_artifact.outcome == 'success' && steps.save.outputs.saved_commit || '' }}
      boopadb_artifact_id: ${{ steps.saved_collection_artifact.outputs.artifact-id }}
      boopadb_artifact_digest: ${{ steps.saved_collection_artifact.outputs.artifact-digest }}
    env:
      TZ: Asia/Tokyo
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SCRAPER_RESERVATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
    steps:
      - name: Record job start
        timeout-minutes: 1
        run: |
          echo "SCRAPER_JOB_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          # All runs share the same durable request session and cooldown state.
          if [[ -z "$DEFAULT_BRANCH" || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Scraping is only allowed on the repository's default branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          fetch-depth: 1
          # A queued run's event SHA may predate the preceding reservation.
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Verify reviewed source before dependencies
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import json, pathlib, subprocess
          expected = {'.gitattributes': {'mode': '100644', 'type': 'blob', 'sha': 'dfe0770424b2a19faf507a501ebfc23be8f54e7b'}, '.gitignore': {'mode': '100644', 'type': 'blob', 'sha': '836703e46e7f5b62c4a338b6f436c6658467e454'}, 'Boopa - BOOTH Price Tracker for VRChat.zip': {'mode': '100644', 'type': 'blob', 'sha': '8c095a39310ed80ef4c45598c46cb70b8dc5ffd9'}, 'assets': {'mode': '040000', 'type': 'tree', 'sha': '47b48dc7bf27d979b35e03c52b7b2022673bce99'}, 'booth-vrc-price-tracker.code-workspace': {'mode': '100644', 'type': 'blob', 'sha': '362d7c25bb405a5cc76d0c7518cc240999a574f4'}, 'dist': {'mode': '040000', 'type': 'tree', 'sha': '01afd779feeac8df3a5a389fe323983884fb87d4'}, 'docs': {'mode': '040000', 'type': 'tree', 'sha': '443fe1722c5902d9a65ae61471396520debeec2d'}, 'extension.crx': {'mode': '100644', 'type': 'blob', 'sha': 'b978dcc922eae497deeca803ccfe8af5bf46ad05'}, 'extension': {'mode': '040000', 'type': 'tree', 'sha': 'da7dc038a4610239e0a612dd4f5918040ceb3785'}, 'index.html': {'mode': '100644', 'type': 'blob', 'sha': 'ce0a431c77fdf0d36e59e1ea17506fa1e8eb1e51'}, 'package-lock.json': {'mode': '100644', 'type': 'blob', 'sha': '43cc06c1bf40ed032d7704ca2e43c8caa2c93339'}, 'package.json': {'mode': '100644', 'type': 'blob', 'sha': 'b4a70f1c8f4faed1ffd3e843d3315f86c341bb15'}, 'scripts': {'mode': '040000', 'type': 'tree', 'sha': '8d25af313c5ce0e38068fb126832ffdcf6c893fe'}, 'src': {'mode': '040000', 'type': 'tree', 'sha': '117328f01b79dd9be1edb8fa251749d4bd6b1324'}, 'test': {'mode': '040000', 'type': 'tree', 'sha': '959de6ff481da39b4a15e706ed5c49277d7a368b'}, 'write-save-receipt.cjs': {'mode': '100644', 'type': 'blob', 'sha': '00d22b6a011c5667a5a48db7d973e1d2e9339863'}}
          raw = subprocess.check_output(['git','ls-tree','-z','HEAD'])
          actual = {}
          for row in raw.split(b'\0'):
              if not row: continue
              info, name = row.decode().split('\t',1)
              mode, kind, sha = info.split()
              if name not in ('data','meta','.github'):
                  actual[name] = dict(mode=mode,type=kind,sha=sha)
          if actual != expected: raise SystemExit('Unreviewed collector source tree; stop before executing repository code')
          subprocess.run(['git','diff','--exit-code','--quiet','HEAD','--','.',':!data',':!meta',':!.github'],check=True)
          others = subprocess.check_output(['git','ls-files','--others','-z']).split(b'\0')
          for entry in others:
              if entry and entry.decode().split('/',1)[0] not in ('data','meta','.github','node_modules'):
                  raise SystemExit('Untracked source/config file; stop before executing repository code')
          if pathlib.Path('.npmrc').exists(): raise SystemExit('Unreviewed npm configuration')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '20'

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Run tests
        timeout-minutes: 5
        run: npm test

      - name: Reserve request budget
        timeout-minutes: 1
        run: node src/reserve-budget.js

      - name: Commit reservation
        timeout-minutes: 5
        # No BOOTH request is permitted until this durable reservation is pushed.
        run: |
          bash scripts/push-data.sh "chore: reserve scrape request budget"

      - name: Verify reviewed source before collection
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import json, pathlib, subprocess
          expected = {'.gitattributes': {'mode': '100644', 'type': 'blob', 'sha': 'dfe0770424b2a19faf507a501ebfc23be8f54e7b'}, '.gitignore': {'mode': '100644', 'type': 'blob', 'sha': '836703e46e7f5b62c4a338b6f436c6658467e454'}, 'Boopa - BOOTH Price Tracker for VRChat.zip': {'mode': '100644', 'type': 'blob', 'sha': '8c095a39310ed80ef4c45598c46cb70b8dc5ffd9'}, 'assets': {'mode': '040000', 'type': 'tree', 'sha': '47b48dc7bf27d979b35e03c52b7b2022673bce99'}, 'booth-vrc-price-tracker.code-workspace': {'mode': '100644', 'type': 'blob', 'sha': '362d7c25bb405a5cc76d0c7518cc240999a574f4'}, 'dist': {'mode': '040000', 'type': 'tree', 'sha': '01afd779feeac8df3a5a389fe323983884fb87d4'}, 'docs': {'mode': '040000', 'type': 'tree', 'sha': '443fe1722c5902d9a65ae61471396520debeec2d'}, 'extension.crx': {'mode': '100644', 'type': 'blob', 'sha': 'b978dcc922eae497deeca803ccfe8af5bf46ad05'}, 'extension': {'mode': '040000', 'type': 'tree', 'sha': 'da7dc038a4610239e0a612dd4f5918040ceb3785'}, 'index.html': {'mode': '100644', 'type': 'blob', 'sha': 'ce0a431c77fdf0d36e59e1ea17506fa1e8eb1e51'}, 'package-lock.json': {'mode': '100644', 'type': 'blob', 'sha': '43cc06c1bf40ed032d7704ca2e43c8caa2c93339'}, 'package.json': {'mode': '100644', 'type': 'blob', 'sha': 'b4a70f1c8f4faed1ffd3e843d3315f86c341bb15'}, 'scripts': {'mode': '040000', 'type': 'tree', 'sha': '8d25af313c5ce0e38068fb126832ffdcf6c893fe'}, 'src': {'mode': '040000', 'type': 'tree', 'sha': '117328f01b79dd9be1edb8fa251749d4bd6b1324'}, 'test': {'mode': '040000', 'type': 'tree', 'sha': '959de6ff481da39b4a15e706ed5c49277d7a368b'}, 'write-save-receipt.cjs': {'mode': '100644', 'type': 'blob', 'sha': '00d22b6a011c5667a5a48db7d973e1d2e9339863'}}
          raw = subprocess.check_output(['git','ls-tree','-z','HEAD'])
          actual = {}
          for row in raw.split(b'\0'):
              if not row: continue
              info, name = row.decode().split('\t',1)
              mode, kind, sha = info.split()
              if name not in ('data','meta','.github'):
                  actual[name] = dict(mode=mode,type=kind,sha=sha)
          if actual != expected: raise SystemExit('Unreviewed collector source tree; stop before executing repository code')
          subprocess.run(['git','diff','--exit-code','--quiet','HEAD','--','.',':!data',':!meta',':!.github'],check=True)
          others = subprocess.check_output(['git','ls-files','--others','-z']).split(b'\0')
          for entry in others:
              if entry and entry.decode().split('/',1)[0] not in ('data','meta','.github','node_modules'):
                  raise SystemExit('Untracked source/config file; stop before executing repository code')
          if pathlib.Path('.npmrc').exists(): raise SystemExit('Unreviewed npm configuration')
          PY
          echo "COLLECTOR_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Scraper
        id: scraper
        # The scraper has a five-hour cap and stops at job start + 5h30m,
        # whichever comes first. This backstop also leaves time to save data.
        timeout-minutes: 305
        continue-on-error: true
        run: node src/scraper.js

      - name: Commit and Push
        id: save
        if: ${{ !cancelled() && (steps.scraper.outcome == 'success' || steps.scraper.outcome == 'failure') }}
        timeout-minutes: 10
        run: bash scripts/push-data.sh

      - name: Verify reviewed source after save
        timeout-minutes: 1
        run: |
          python3 -I - <<'PY'
          import json, pathlib, subprocess
          expected = {'.gitattributes': {'mode': '100644', 'type': 'blob', 'sha': 'dfe0770424b2a19faf507a501ebfc23be8f54e7b'}, '.gitignore': {'mode': '100644', 'type': 'blob', 'sha': '836703e46e7f5b62c4a338b6f436c6658467e454'}, 'Boopa - BOOTH Price Tracker for VRChat.zip': {'mode': '100644', 'type': 'blob', 'sha': '8c095a39310ed80ef4c45598c46cb70b8dc5ffd9'}, 'assets': {'mode': '040000', 'type': 'tree', 'sha': '47b48dc7bf27d979b35e03c52b7b2022673bce99'}, 'booth-vrc-price-tracker.code-workspace': {'mode': '100644', 'type': 'blob', 'sha': '362d7c25bb405a5cc76d0c7518cc240999a574f4'}, 'dist': {'mode': '040000', 'type': 'tree', 'sha': '01afd779feeac8df3a5a389fe323983884fb87d4'}, 'docs': {'mode': '040000', 'type': 'tree', 'sha': '443fe1722c5902d9a65ae61471396520debeec2d'}, 'extension.crx': {'mode': '100644', 'type': 'blob', 'sha': 'b978dcc922eae497deeca803ccfe8af5bf46ad05'}, 'extension': {'mode': '040000', 'type': 'tree', 'sha': 'da7dc038a4610239e0a612dd4f5918040ceb3785'}, 'index.html': {'mode': '100644', 'type': 'blob', 'sha': 'ce0a431c77fdf0d36e59e1ea17506fa1e8eb1e51'}, 'package-lock.json': {'mode': '100644', 'type': 'blob', 'sha': '43cc06c1bf40ed032d7704ca2e43c8caa2c93339'}, 'package.json': {'mode': '100644', 'type': 'blob', 'sha': 'b4a70f1c8f4faed1ffd3e843d3315f86c341bb15'}, 'scripts': {'mode': '040000', 'type': 'tree', 'sha': '8d25af313c5ce0e38068fb126832ffdcf6c893fe'}, 'src': {'mode': '040000', 'type': 'tree', 'sha': '117328f01b79dd9be1edb8fa251749d4bd6b1324'}, 'test': {'mode': '040000', 'type': 'tree', 'sha': '959de6ff481da39b4a15e706ed5c49277d7a368b'}, 'write-save-receipt.cjs': {'mode': '100644', 'type': 'blob', 'sha': '00d22b6a011c5667a5a48db7d973e1d2e9339863'}}
          raw = subprocess.check_output(['git','ls-tree','-z','HEAD'])
          actual = {}
          for row in raw.split(b'\0'):
              if not row: continue
              info, name = row.decode().split('\t',1)
              mode, kind, sha = info.split()
              if name not in ('data','meta','.github'):
                  actual[name] = dict(mode=mode,type=kind,sha=sha)
          if actual != expected: raise SystemExit('Unreviewed collector source tree; stop before executing repository code')
          subprocess.run(['git','diff','--exit-code','--quiet','HEAD','--','.',':!data',':!meta',':!.github'],check=True)
          others = subprocess.check_output(['git','ls-files','--others','-z']).split(b'\0')
          for entry in others:
              if entry and entry.decode().split('/',1)[0] not in ('data','meta','.github','node_modules'):
                  raise SystemExit('Untracked source/config file; stop before executing repository code')
          if pathlib.Path('.npmrc').exists(): raise SystemExit('Unreviewed npm configuration')
          PY

      - name: Report scraper failure
        if: ${{ always() && steps.scraper.outcome == 'failure' }}
        timeout-minutes: 1
        run: |
          echo "::error::Scraper failed. Saving any completed data and checkpoints was attempted above."
          exit 1

      - name: Continue collection
        # A failed scraper can have a successful conclusion because of
        # continue-on-error. Check its original outcome and the final push.
        if: ${{ success() && steps.scraper.outcome == 'success' && steps.save.outcome == 'success' && steps.scraper.outputs.continue_collection == 'true' }}
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # One dispatch, no retries after an uncertain response. Cron is fallback.
        run: node src/continuation.js

      - name: Record immutable saved collection
        if: ${{ success() && steps.scraper.outcome == 'success' && steps.save.outcome == 'success' && steps.scraper.outputs.boopadb_eligible == 'true' }}
        timeout-minutes: 1
        env:
          SCRAPER_OUTCOME: ${{ steps.scraper.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          SAVED_COMMIT: ${{ steps.save.outputs.saved_commit }}
        run: node write-save-receipt.cjs

      - name: Retain immutable saved collection
        id: saved_collection_artifact
        timeout-minutes: 1
        if: ${{ success() && steps.scraper.outcome == 'success' && steps.save.outcome == 'success' && steps.scraper.outputs.boopadb_eligible == 'true' }}
        # Upstream upload-artifact v4.6.2 commit verified read-only; local proposal.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boopadb-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: saved-collection.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  boopadb_handoff:
    name: Verify and generate BoopaDB candidate (publication off)
    needs: scrape
    if: ${{ needs.scrape.result == 'success' && needs.scrape.outputs.boopadb_artifact_id != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pinned workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/boopa
            .github/workflows
      - name: Acquire, generate and validate privately on runner
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOPA_SCRAPE_RESULT: ${{ needs.scrape.result }}
          BOOPA_SAVED_COMMIT: ${{ needs.scrape.outputs.boopadb_saved_commit }}
          BOOPA_ARTIFACT_ID: ${{ needs.scrape.outputs.boopadb_artifact_id }}
          BOOPA_ARTIFACT_DIGEST: ${{ needs.scrape.outputs.boopadb_artifact_digest }}
        run: |
          python3 -I - <<'PY_BOOT'
          import hashlib, importlib.util, json, os, pathlib, re, shutil, subprocess, sys
          root = pathlib.Path('.github/boopa').resolve(strict=True)
          manifest = root / 'DEPLOYMENT-CODE-INVENTORY.json'
          if manifest.is_symlink() or hashlib.sha256(manifest.read_bytes()).hexdigest() != '663a8a4969e7252a8b7202a987d7350be7f511e97e0632651a7608009a31c899':
              raise SystemExit('Deployment inventory differs; stop')
          for name, entry in json.loads(manifest.read_bytes())['files'].items():
              path = root / name
              if path.is_symlink() or not path.resolve().is_relative_to(root) or not path.is_file():
                  raise SystemExit('Invalid deployment member; stop')
              raw = path.read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit('Deployment code differs; stop')
          recovery_root = root / 'capacity-recovery-r2'
          recovery_manifest = recovery_root / 'CODE-INVENTORY.json'
          if recovery_manifest.is_symlink() or hashlib.sha256(recovery_manifest.read_bytes()).hexdigest() != 'eddff02a56eb875b8dcdfc71f734fb4a187c45731d442a4cd383244f0b84b2d8':
              raise SystemExit('Recovery code inventory differs; stop')
          for name, entry in json.loads(recovery_manifest.read_bytes())['files'].items():
              path = recovery_root / name
              if path.is_symlink() or not path.resolve().is_relative_to(recovery_root) or not path.is_file():
                  raise SystemExit('Invalid recovery code member; stop')
              raw = path.read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                  raise SystemExit('Recovery code differs; stop')
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          available = shutil.disk_usage(temp).free
          print(json.dumps({'capacity_free_bytes': available, 'capacity_required_free_bytes': 20 * 1024**3}), flush=True)
          if available < 20 * 1024**3:
              names = ('GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','GITHUB_REPOSITORY','ImageOS','ImageVersion','RUNNER_TEMP','GITHUB_WORKSPACE')
              subprocess.run(['sudo','env',*[name+'='+os.environ[name] for name in names],sys.executable,'-I',str(recovery_root/'capacity_preflight.py'),'--cleanup-preinstalled-sdks'],check=True,timeout=310)
              available = shutil.disk_usage(temp).free
              print('capacity_free_bytes_after_cleanup=' + str(available), flush=True)
          if available < 20 * 1024**3:
              raise SystemExit('Need 20 GiB free after allowlisted SDK cleanup; stop')
          digest = os.environ['BOOPA_ARTIFACT_DIGEST']
          if re.fullmatch(r'[0-9a-f]{64}', digest):
              os.environ['BOOPA_ARTIFACT_DIGEST'] = 'sha256:' + digest
          elif not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Invalid upload-artifact SHA-256 output; stop')
          maker = root / 'make_runtime_plan.py'
          spec = importlib.util.spec_from_file_location('make_generation_plan', maker)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          plan = module.make(pathlib.Path('.github/workflows/daily_scrape.yml').resolve(strict=True), temp / 'boopa-generation-plan')
          entry = root / 'auto-update-connection-20261108/runtime-entry-r1/run_generation_entry.py'
          subprocess.run([sys.executable, '-I', str(entry), '--plan', plan['path'], '--plan-sha256', plan['sha256'], '--output', str(temp / 'boopa-generated')], check=True)
          print('Saved input and local candidate validated. Publication remains OFF; no publishing token used.')
          PY_BOOT

      - name: Retain validated candidate for read-only inspection (publication off)
        if: ${{ success() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boopadb-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boopa-generated/retained-candidate/
          # The exporter only allows the existing 724 public paths and safe receipts.
          # This is necessary for the existing public .nojekyll marker.
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 6
